<script>/* ===================== BATCHSHIFT SIMULATION ENGINE =====================
   Pure functions only: no DOM access. All data synthetic (educational).   */
const ENGINE = (() => {
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normal(r) { let u = 0; while (u === 0) u = r(); const v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  // ---- Assumed coefficients (educational, not validated) ----
  const C = {
    Y0: 5.00,      // baseline final yield, g/L (synthetic historical mean, batches 001-006)
    Ycur: 4.30,    // current final yield, g/L (synthetic historical mean, batches 019-024)
    kA: 0.0010, Aopt: 18,       // inoculum fitness curvature (1/h^2), optimum age (h)
    kF: 0.0012,                 // titer loss per minute of feed-timing deviation
    kD: 0.0015,                 // exponential titer loss per minute of true low-DO time
    Sref: 0.97,                 // sensor reliability above which no hidden excursion accumulates
    L0: 0.030, lD: 0.0005, lF: 0.0003, // lysis fraction model
    H0: 0.95, hL: 1.2,          // harvest (clarification) efficiency and sensitivity to lysis
    saD: 0.0012, saA: 0.003, Aact: 22, saPool: 1.2, Rpool: 0.90, // specific activity model
    SAtarget: 95                // educational activity target, U/mg (assumption, not a spec)
  };
  const BASE = { A: 18, F: 4, D: 8, M: 1, S: 0.97, R: 0.88, train: false, qc: false };
  const fI = A => Math.max(0.5, 1 - C.kA * (A - C.Aopt) ** 2);
  const Lb = C.L0 + C.lD * BASE.D + C.lF * BASE.F;
  const T0 = C.Y0 / (fI(BASE.A) * (1 - C.kF * BASE.F) * Math.exp(-C.kD * BASE.D) * C.H0 * BASE.R);
  const ZERO = { d: 0, f: 0, r: 0, e: 0, a: 0 };

  // The domino chain: operating condition -> intermediate state -> harvest -> recovery -> final
  function chain(p, kappa, dist = ZERO) {
    const inoc = fI(p.A);
    const Ft = Math.max(0, p.F + dist.f);
    const Dm = Math.max(0, p.D + dist.d);                         // sensor-reported
    const hidden = Math.max(0, C.Sref - p.S) * kappa;              // unseen low-DO minutes
    const Dt = Dm + hidden;                                        // true low-DO minutes
    const fF = 1 - C.kF * Ft, fD = Math.exp(-C.kD * Dt);
    const T = T0 * inoc * fF * fD;
    const L = C.L0 + C.lD * Dt + C.lF * Ft;
    const H = clamp(C.H0 - C.hL * (L - Lb), 0.5, 0.99);
    const Reff = clamp(p.R + dist.r, 0.5, 0.99);
    const harvested = T * H;
    const Y = harvested * Reff * (1 + dist.e);

  // Loss contribution (model): restore one factor at a time from current practice
  const lossShare = (() => {
    const yc = E.chain(CUR, 60).Y, tot = C.Y0 - yc;
    return ['A', 'F', 'D', 'S', 'R'].map(k => ({ k, loss: E.chain({ ...CUR, [k]: E.BASE[k] }, 60).Y - yc })).map(x => ({ ...x, share: x.loss / tot }));
  })();
  return { rows, norm: DATA.norm, PARETO, IVS, BUDGET, outcome, SUSPECTS, stats, CUR, lossShare, mean };
})();

/* ===================== CASE 014 SCORING (public rules; points come from the encrypted key) ===================== */
const SCORE = (() => {
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const pick = (map, v) => (map && v != null && map[v] != null) ? map[v] : 0;
  // A = answers: { r1:{lead:{v,...}}, r2:{...}, ... } ; K = decrypted key ; adj = {qid:{points,reason}}
  function team(A, K, adj) {
    const get = (r, q) => A?.[r]?.[q]?.v;
    const P = K.pts, per = {}, why = {};
    // Round 1
    const lead = get('r1', 'lead');
    if (lead) {
      let p = pick(P.lead, lead.lead), note = `Leading suspect "${lead.lead}" = ${p}.`;
      if (p < 2 && (lead.sel || []).includes(K.correctPrimary)) { p = 2; note += ' Partial credit: the supported factor was among the selected suspects.'; }
      per.lead = p; why.lead = note;
    }
    const w = get('r1', 'why'); if (w != null) { per.why = pick(P.why, w); why.why = `Reasoning basis "${w}".`; }
    // Round 2
    for (const q of ['a1', 'a2', 'b1', 'b2', 'd1', 'd2', 'd3']) { const v = get('r2', q); if (v != null) { per[q] = pick(P[q], v); why[q] = `Answer "${v}".`; } }
    const fb = get('r2', 'c1');
    if (fb) { let s = 0; const parts = []; for (const [item, cat] of Object.entries(fb)) { const p = pick(P.c1[item], cat); s += p; parts.push(`${item}→${cat}: ${p}`); } per.c1 = Math.min(10, s); why.c1 = parts.join('; ') + '.'; }
    // Round 3
    const prim = get('r3', 'primary');
    if (prim) { per.primary = pick(P.primary, prim.lead ?? prim); why.primary = `Primary "${prim.lead ?? prim}".`; }
    const ex = get('r3', 'extra');
    if (ex) {
      const f = ex.includes('feed'), sh = ex.includes('shift');
      let p = f ? 4 : 2; if (sh) p = Math.max(0, p - 2);
      if (!f && ex.length && !sh && ex.every(x => !K.minor.includes(x))) p = 1;
      per.extra = p; why.extra = `Extras [${ex.join(', ') || 'none'}]: ${f ? 'includes the supported minor contributor' : 'misses feed timing'}${sh ? '; names the confounded red herring' : ''}.`;
    }
    for (const q of ['ev', 'alt', 'act', 'met']) { const v = get('r3', q); if (v != null) { per[q] = pick(P[q], v); why[q] = `Answer "${v}".`; } }
    const conf = get('r3', 'conf');
    if (conf != null) {
      const ok = (prim?.lead ?? prim) === K.correctPrimary;
      per.conf = ok ? (conf >= 3 ? 2 : 1) : (conf <= 2 ? 2 : conf === 3 ? 1 : 0);
      why.conf = `Confidence ${conf} with a ${ok ? 'supported' : 'unsupported'} hypothesis: ${per.conf === 2 ? 'well calibrated' : 'over- or under-confident'}.`;
    }
    // Round 4
    const plan = get('r4', 'plan');
    if (plan && Array.isArray(plan.ids)) {
      const o = CASE.outcome(plan.ids), C = ENGINE.C;
      if (o.cost > CASE.BUDGET) { per.plan = 0; why.plan = 'Over budget: not feasible.'; }
      else {
        const y = 8 * clamp((o.Ym - C.Ycur) / (C.Y0 - C.Ycur), 0, 1);
        const q = 4 * clamp((o.SAm - 94) / 5, 0, 1);
        const c = 1.5 * clamp((2.1 - o.cv) / 0.6, 0, 1) + 1.5 * clamp((20 - o.risk) / 20, 0, 1);
        const f = plan.ids.length ? 2 : 0;
        const hyp = prim?.lead ?? prim, fix = K.fixFor[hyp], hasFix = fix && plan.ids.includes(fix);
        const al = hyp === K.correctPrimary && hasFix ? 3 : plan.ids.includes(K.fixFor[K.correctPrimary]) ? 1 : 0;
        per.plan = +(y + q + c + f + al).toFixed(2);
        why.plan = `Yield ${o.Ym.toFixed(3)} g/L → ${y.toFixed(1)}/8; activity ${o.SAm.toFixed(1)} U/mg → ${q.toFixed(1)}/4; CV ${o.cv.toFixed(2)}% and risk ${o.risk.toFixed(0)} → ${c.toFixed(1)}/3; feasibility ${f}/2; evidence alignment ${al}/3.`;
      }
    }
    // Facilitator adjustments override the automatic score for that question
    for (const [q, a] of Object.entries(adj || {})) if (a && typeof a.points === 'number') { per[q] = clamp(a.points, 0, Q.byId[q].max); why[q] = (why[q] ? why[q] + ' ' : '') + `Facilitator set ${a.points}: ${a.reason}`; }
    const rt = { r1: 0, r2: 0, r3: 0, r4: 0 };
    for (const [q, p] of Object.entries(per)) rt[Q.byId[q].r] += p;
    const total = rt.r1 + rt.r2 + rt.r3 + rt.r4;
    const correct = Object.entries(per).filter(([q, p]) => p >= Q.byId[q].max - 1e-9).length;
    return { per, why, rounds: rt, total: +total.toFixed(2), correct, reasoning: rt.r3, analysis: rt.r2, intervention: rt.r4 };
  }
  // Deterministic ranking: total, then Round 3 reasoning, then Round 2 analysis; equal on all three = shared rank
  function rank(list) {
    const s = [...list].sort((a, b) => b.total - a.total || b.reasoning - a.reasoning || b.analysis - a.analysis || a.name.localeCompare(b.name));
    let prev = null, rk = 0;
    s.forEach((t, i) => { const key = [t.total, t.reasoning, t.analysis].map(x => x.toFixed(2)).join('|'); if (key !== prev) { rk = i + 1; prev = key; } t.rank = rk; });
    return s;
  }
  return { team, rank, MAX: { r1: 10, r2: 40, r3: 30, r4: 20, total: 100 } };
})();

/* ===================== CASE 014 BACKEND =====================
   One small interface, two implementations:
   - FirebaseDB: Firebase Realtime Database + anonymous auth (real cross-device multiplayer)
   - DemoDB: this-device-only store shared between browser tabs (clearly labelled demo mode)
   Interface: init(), uid, mode, now(), get(p), set(p,v), update(p,obj), push(p,v)->key, on(p,cb)->unsub, claim(p,v)->bool */
const FB_VER = '10.12.2';
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }

class FirebaseDB {
  constructor(cfg) { this.cfg = cfg; this.mode = 'live'; this.offset = 0; }
  async init() {
    if (!window.firebase) {
      const base = `https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/`;
      await loadScript(base + 'firebase-app-compat.js');
      await loadScript(base + 'firebase-auth-compat.js');
      await loadScript(base + 'firebase-database-compat.js');
    }
    const name = 'case014-' + this.cfg.projectId;
    this.app = firebase.apps.find(a => a.name === name) || firebase.initializeApp(this.cfg, name);
    const cred = await this.app.auth().signInAnonymously();
    this.uid = cred.user.uid;
    this.db = this.app.database();
    this.db.ref('.info/serverTimeOffset').on('value', s => { this.offset = s.val() || 0; });
    return this;
  }
  now() { return Date.now() + this.offset; }
  ref(p) { return this.db.ref(p); }
  async get(p) { return (await this.ref(p).once('value')).val(); }
  set(p, v) { return this.ref(p).set(v); }
  update(p, o) { return this.ref(p).update(o); }
  async push(p, v) { const r = this.ref(p).push(); await r.set(v); return r.key; }
  on(p, cb) { const r = this.ref(p), h = s => cb(s.val()); r.on('value', h, e => console.warn('listen', p, e.message)); return () => r.off('value', h); }
  async claim(p, v) { const r = await this.ref(p).transaction(cur => (cur === null ? v : undefined)); return r.committed; }
}

/* Demo store. Applies the same access rules as database.rules.json so demo behaviour matches live behaviour. */
class DemoDB {
  constructor() { this.mode = 'demo'; this.subs = []; }
  async init() {
    try { this.uid = sessionStorage.getItem('case014-demo-uid'); } catch (e) { }
    if (!this.uid) { this.uid = 'demo-' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('case014-demo-uid', this.uid); } catch (e) { } }
    try { this.data = JSON.parse(localStorage.getItem('case014-demo-db')) || {}; } catch (e) { this.data = {}; }
    try { this.bc = new BroadcastChannel('case014-demo'); this.bc.onmessage = m => { this.data = m.data; this.fire(); }; } catch (e) { }
    return this;
  }
  now() { return Date.now(); }
  split(p) { return p.split('/').filter(Boolean); }
  read(p) { return this.split(p).reduce((a, k) => (a == null ? null : a[k] ?? null), this.data); }
  write(p, v) {
    const ks = this.split(p), last = ks.pop(); let o = this.data;
    for (const k of ks) { if (o[k] == null || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }
    if (v === null || v === undefined) delete o[last]; else o[last] = JSON.parse(JSON.stringify(v));
  }
  commit() { try { localStorage.setItem('case014-demo-db', JSON.stringify(this.data)); } catch (e) { } try { this.bc && this.bc.postMessage(this.data); } catch (e) { } this.fire(); }
  fire() { this.subs.forEach(s => { const v = JSON.stringify(this.read(s.p)); if (v !== s.last) { s.last = v; s.cb(this.read(s.p)); } }); }
  // ---- access rules (mirror of database.rules.json) ----
  allowed(p, v) {
    const k = this.split(p); if (k[0] !== 'sessions' || !k[1]) return false;
    const sid = k[1], host = this.read(`sessions/${sid}/meta/hostUid`), isHost = host === this.uid, part = k[2];
    if (part === 'meta') return !host || isHost;
    if (['state', 'public', 'scores', 'adjust', 'audit', 'results'].includes(part)) return isHost;
    if (part === 'names') return k.length === 4 && this.read(p) == null && v === this.uid;
    if (part === 'teams' || part === 'reflect') return !!host && k[3] === this.uid;
    if (part === 'answers' || part === 'history') {
      if (k[3] !== this.uid) return false;
      const st = this.read(`sessions/${sid}/state`) || {};
      const open = st.rounds?.[k[4]]?.status === 'open' || st.allowRevisions === true;
      if (part === 'history') return open && this.read(p) == null;
      return open;
    }
    return false;
  }
  deny(p) { const e = new Error('PERMISSION_DENIED: ' + p); e.code = 'PERMISSION_DENIED'; return Promise.reject(e); }
  async get(p) { return JSON.parse(JSON.stringify(this.read(p))); }
  set(p, v) { if (!this.allowed(p, v)) return this.deny(p); this.write(p, v); this.commit(); return Promise.resolve(); }
  update(p, o) { for (const [k, v] of Object.entries(o)) if (!this.allowed(p + '/' + k, v)) return this.deny(p + '/' + k); for (const [k, v] of Object.entries(o)) this.write(p + '/' + k, v); this.commit(); return Promise.resolve(); }
  async push(p, v) { const key = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await this.set(p + '/' + key, v); return key; }
  on(p, cb) { const s = { p, cb, last: JSON.stringify(this.read(p)) }; this.subs.push(s); setTimeout(() => cb(this.read(p)), 0); return () => { this.subs = this.subs.filter(x => x !== s); }; }
  async claim(p, v) { if (this.read(p) != null) return false; await this.set(p, v); return true; }
  reset() { this.data = {}; this.commit(); }
}

// Answer-key decryption (AES-GCM, PBKDF2-SHA256). Wrong passphrase → throws.
async function unlockKey(pass) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(KEY_ENC.salt), iterations: KEY_ENC.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(KEY_ENC.iv) }, key, b(KEY_ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* Hand-built SVG charts (reused from BatchShift). Colors come from CSS tokens. */
function ticks(lo, hi, n = 4) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), f = step0 / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag; const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return { t: out, d: Math.max(0, -Math.floor(Math.log10(step))) };
}
function lineChart(o) {
  const W = 640, H = o.h || 200, ml = 50, mr = 14, mt = o.title ? 26 : 10, mb = 28;

async function doJoin() {
  const code = $('#j_code').value.trim().toUpperCase(), name = $('#j_name').value.trim(), members = $('#j_members').value.trim(), icon = ($('input[name=j_icon]:checked') || {}).value || ICONS[0];

  if (!/^[A-Z0-9]{6}$/.test(code)) { G.view.joinErr = 'Session codes have 6 letters or numbers. Check the code on the projector.'; return render(); }
  if (name.length < 2) { G.view.joinErr = 'Enter a team name of at least 2 characters.'; return render(); }
  const meta = await DB.get(`sessions/${code}/meta`).catch(() => null);
  if (!meta) { G.view.joinErr = `No session with code ${code}. Check the code on the projector.`; return render(); }
  const existing = await DB.get(`sessions/${code}/teams/${DB.uid}`).catch(() => null);
  if (existing) { await openSession(code, 'team'); toast(`Welcome back, ${existing.name}`); return render(); }
  const n = normName(name); if (!n) { G.view.joinErr = 'Use letters or numbers in the team name.'; return render(); }
  const ok = await DB.claim(`sessions/${code}/names/${n}`, DB.uid).catch(() => false);
  if (!ok) { const owner = await DB.get(`sessions/${code}/names/${n}`).catch(() => null); if (owner !== DB.uid) { G.view.joinErr = `The name "${name}" is already taken in this session. Choose another.`; return render(); } }
  try { await DB.set(`sessions/${code}/teams/${DB.uid}`, { name, members, icon, joinedAt: DB.now() }); }
  catch (e) { G.view.joinErr = 'Could not join: ' + e.message; return render(); }
  await openSession(code, 'team'); toast(`Joined as ${name}`); render();
}

// ---------- team events ----------
function setDraft(k, v) { G.draft[k] = v; }
function collect(r, q) {
  const v = dval(r, q), t = dtext(r, q);
  if (q === 'lead') return (v && v.lead) ? { v, text: '' } : null;
  if (q === 'c1') return v && Object.keys(Q.byId.c1.items).every(k => v[k]) ? { v } : null;
  if (q === 'extra') return { v: v || [] };
  if (q === 'why') return v && t.trim() ? { v, text: t.trim() } : null;
  if (q === 'plan') return v && v.ids ? { v, text: t } : null;
  if (v == null || v === '') return null;
  return { v, text: t };
}
async function submitAnswers(r, qs) {
  if (!roundOpen(r)) return toast('This round is closed.', true);
  const missing = [], out = {};
  for (const q of qs) { const c = collect(r, q); if (!c) missing.push(q); else out[q] = c; }
  if (r === 'r1' && !dval('r1', 'lead', {})?.conf) missing.push('confidence');
  if (missing.length) return toast('Answer every question first: ' + missing.map(q => Q.byId[q]?.prompt || q).join('; '), true);
  if (r === 'r4' && CASE.outcome(out.plan.v.ids).cost > CASE.BUDGET) return toast('Over budget. Remove an intervention first.', true);
  const now = DB.now(), rs = G.state.rounds[r], late = rs?.endsAt && now > rs.endsAt;
  const upd = {}, unchanged = [];
  for (const [q, c] of Object.entries(out)) {
    const prev = ans(r, q);
    if (prev && JSON.stringify(prev.v) === JSON.stringify(c.v) && (prev.text || '') === (c.text || '')) { unchanged.push(q); continue; }
    upd[q] = { v: c.v, text: c.text || '', at: now, rev: (prev?.rev || 0) + 1, late: !!late };
  }
  if (!Object.keys(upd).length) return toast('Already submitted. Nothing changed.');
  try {
    await DB.update(P('answers', DB.uid, r), upd);
    for (const [q, a] of Object.entries(upd)) await DB.push(P('history', DB.uid, r, q), a).catch(() => { });
    Object.keys(upd).forEach(q => { delete G.draft[r + '.' + q]; delete G.draft[r + '.' + q + '.t']; });
    toast(late ? 'Submitted (late)' : 'Submitted');
  } catch (e) { toast(/PERMISSION/.test(e.message) ? 'The round has closed. Your answer was not recorded.' : 'Could not submit: ' + e.message, true); }
}

let scoreT = null, lastWrite = {};
function scheduleScore() { if (G.role !== 'host' || !G.host.K) return; clearTimeout(scoreT); scoreT = setTimeout(scoreAll, 400); }
function computeAll() {
  const H = G.host, st = G.state || {}, out = {};
  for (const [uid, t] of Object.entries(H.teams || {})) {
    const s = SCORE.team(H.answers?.[uid] || {}, H.K, H.adjust?.[uid] || {});
    const status = ROUNDS.filter(r => ['open', 'closed', 'paused'].includes(st.rounds?.[r]?.status)).map(r => {
      const qs = Q.inRound(r), a = H.answers?.[uid]?.[r] || {}, n = qs.filter(q => a[q.id]).length, late = qs.some(q => a[q.id]?.late);

    });
    out[uid] = { ...s, uid, name: t.name, icon: t.icon, status: status.join(' · ') || 'joined' };
  }
  return out;
}
async function scoreAll() {
  const st = G.state; if (!st || !G.host.K) return;
  const all = computeAll(), ranked = SCORE.rank(Object.values(all)), H = G.host;
  const closed = ROUNDS.filter(r => st.rounds?.[r]?.status === 'closed');
  const writes = [];
  const scores = Object.fromEntries(ranked.map(t => [t.uid, { total: t.total, rounds: t.rounds, per: t.per, why: t.why, rank: t.rank, correct: t.correct }]));
  if (JSON.stringify(scores) !== lastWrite.scores) { lastWrite.scores = JSON.stringify(scores); writes.push(DB.set(P('scores'), scores)); }
  // per-team results: only rounds the reveal setting allows
  const vis = st.revealMode === 'immediate' ? ROUNDS : closed;
  const results = Object.fromEntries(ranked.map(t => [t.uid, { closed: vis, rounds: Object.fromEntries(vis.map(r => [r, t.rounds[r]])), per: Object.fromEntries(Object.entries(t.per).filter(([q]) => vis.includes(Q.byId[q].r))), why: Object.fromEntries(Object.entries(t.why).filter(([q]) => vis.includes(Q.byId[q].r))) }]));
  if (JSON.stringify(results) !== lastWrite.results) { lastWrite.results = JSON.stringify(results); writes.push(DB.set(P('results'), results)); }
  // public leaderboard per facilitator setting
  const mode = st.board || 'provisional', ended = st.phase === 'ended';
  let rows = [];
  if (mode === 'provisional' || (mode === 'final' && st.finalized) || (mode === 'anon') || (ended && st.finalized)) {
    rows = ranked.map((t, i) => ({ uid: t.uid, rank: t.rank, name: mode === 'anon' && !(ended && st.finalized) ? 'Team ' + String.fromCharCode(65 + i) : t.name, icon: mode === 'anon' && !(ended && st.finalized) ? '❔' : t.icon, total: t.total, r1: t.rounds.r1, r2: t.rounds.r2, r3: t.rounds.r3, r4: t.rounds.r4, correct: t.correct, reasoning: t.reasoning, intervention: t.intervention, status: t.status }));
    if (mode === 'anon' && !(ended && st.finalized)) rows.forEach(r => { r.uid = null; });
  }
  if (mode === 'final' && st.finalized && st.finalSnapshot) rows = st.finalSnapshot;
  const lb = { mode, finalized: !!st.finalized, at: DB.now(), rows };
  const cmp = JSON.stringify({ ...lb, at: 0 });
  if (cmp !== lastWrite.lb) { lastWrite.lb = cmp; writes.push(DB.set(P('public/leaderboard'), lb)); }
  await Promise.all(writes).catch(e => toast('Score update failed: ' + e.message, true));
}

// ---------- round control ----------
async function setState(patch, msg) { try { await DB.update(P('state'), patch); if (msg) audit(msg); } catch (e) { toast('Could not update: ' + e.message, true); } }
async function openRound(r) {
  const mins = Math.max(0.5, Math.min(30, +($(`#mins_${r}`)?.value || Q.rounds[r].mins)));
  const patch = { phase: r, [`rounds/${r}`]: { status: 'open', mins, openedAt: DB.now(), endsAt: DB.now() + mins * 60000 } };
  for (const x of ROUNDS) if (x !== r && G.state.rounds?.[x]?.status === 'open') patch[`rounds/${x}/status`] = 'closed';
  await setState(patch, `Opened round ${r[1]} for ${mins} min`);
}
async function closeRound(r, auto) { await setState({ [`rounds/${r}/status`]: 'closed', [`rounds/${r}/closedAt`]: DB.now() }, `${auto ? 'Auto-closed' : 'Closed'} round ${r[1]}`); scheduleScore(); }
async function pauseRound(r) { const rs = G.state.rounds[r]; if (rs.status === 'open') await setState({ [`rounds/${r}/status`]: 'paused', [`rounds/${r}/remaining`]: Math.max(0, rs.endsAt - DB.now()) }, `Paused round ${r[1]}`); else if (rs.status === 'paused') await setState({ [`rounds/${r}/status`]: 'open', [`rounds/${r}/endsAt`]: DB.now() + (rs.remaining || 0) }, `Resumed round ${r[1]}`); }
async function extendRound(r) { const rs = G.state.rounds[r]; if (rs.status === 'open') await setState({ [`rounds/${r}/endsAt`]: rs.endsAt + 60000 }, `Added 1 min to round ${r[1]}`); }

  try { await DB.set(P('public/reveals', r), items); audit(`Revealed explanations for round ${r[1]}`); toast('Explanations revealed'); } catch (e) { toast(e.message, true); }
}

    case 'saveReflect': {
      const o = { at: DB.now() }; Q.reflect.forEach(([k]) => o[k] = ($('#rf_' + k)?.value || '').trim());
      try { await DB.set(P('reflect', DB.uid), o); Q.reflect.forEach(([k]) => delete G.draft['rf.' + k]); toast('Reflection saved'); } catch (er) { toast(er.message, true); } break;
    }
    case 'myBrief': download(`case014_${normName(G.me.name)}_brief.html`, docShell('Executive brief', briefHTML(G.me.name, G.myAns, G.myRes ? { rounds: G.myRes.rounds } : null)), 'text/html'); return;
    case 'myReflect': download(`case014_${normName(G.me.name)}_reflection.html`, docShell('Reflection', reflectHTML(G.me.name, G.myReflect)), 'text/html'); return;
    case 'hostCreate': await hostCreate(); return;
    case 'hostResume': await hostResume(); return;
    case 'unlock': try { H.K = await unlockKey($('#h_pass').value); scheduleScore(); } catch (er) { toast('Wrong passphrase', true); } break;
    case 'saveCfg': { const c = cfgFromText($('#h_cfg').value); if (!c) { G.view.hostErr = 'That does not look like a Firebase config with apiKey, databaseURL and projectId.'; break; } LS.set('case014-fbcfg', encCfg(c)); location.reload(); return; }
    case 'clearCfg': LS.set('case014-fbcfg', null); history.replaceState(null, '', location.pathname + '#host'); location.reload(); return;
    case 'copyLink': copy(joinURL(G.sid)); return;
    case 'endSession': await setState({ phase: 'ended', ...Object.fromEntries(ROUNDS.filter(r => G.state.rounds?.[r]?.status === 'open' || G.state.rounds?.[r]?.status === 'paused').map(r => [`rounds/${r}/status`, 'closed'])) }, 'Session ended'); scheduleScore(); break;
    case 'reopen': await setState({ phase: 'lobby' }, 'Session reopened'); break;
    case 'open': await openRound(d.r); break;
    case 'close': await closeRound(d.r); break;
    case 'pause': await pauseRound(d.r); break;
    case 'extend': await extendRound(d.r); break;
    case 'reveal': await revealRound(d.r); break;
    case 'finalize': { const rows = SCORE.rank(Object.values(computeAll())).map(t => ({ uid: t.uid, rank: t.rank, name: t.name, icon: t.icon, total: t.total, r1: t.rounds.r1, r2: t.rounds.r2, r3: t.rounds.r3, r4: t.rounds.r4, correct: t.correct, reasoning: t.reasoning, intervention: t.intervention, status: t.status })); await setState({ finalized: true, finalSnapshot: rows }, 'Scores finalised'); scheduleScore(); break; }
    case 'adjust': await saveAdjust(d.uid, d.q); return;
    case 'unadjust': await clearAdjust(d.uid, d.q); return;
    case 'exp': ({ answers: exportAnswers, results: exportResults, log: exportLog, briefs: exportBriefs, reflect: exportReflect, audit: exportAudit })[d.k](); return;
    case 'seedDemo': seedDemo(); return;
    case 'wipeDemo': if (DB.mode === 'demo') { DB.reset(); LS.set('case014-host-sid', null); location.hash = 'host'; location.reload(); } return;
    default: return;
  }
  render();
});
document.addEventListener('change', async e => {
  const t = e.target, d = t.dataset;
  if (d.draft) { G.draft[d.draft] = t.value; return render(); }
  if (d.draftnum) { G.draft[d.draftnum] = +t.value; return render(); }
  if (d.sel || d.lead || d.conf) {
    const v = { ...(dval('r1', 'lead', {}) || {}) }; v.sel = [...(v.sel || [])];
    if (d.sel) { v.sel = t.checked ? [...new Set([...v.sel, d.sel])] : v.sel.filter(x => x !== d.sel); }
    if (d.lead) { v.lead = d.lead; if (!v.sel.includes(d.lead)) v.sel.push(d.lead); }
    if (d.conf) v.conf = +d.conf;
    G.draft['r1.lead'] = v; return render();
  }
  if (d.multi) { const [r, q] = d.multi.split('.'), lim = Q.byId[q].limit || 99; let v = [...(dval(r, q, []) || [])]; v = t.checked ? [...new Set([...v, t.value])] : v.filter(x => x !== t.value); if (v.length > lim) { toast(`Choose at most ${lim}.`, true); t.checked = false; return; } G.draft[d.multi] = v; return render(); }
  if (d.fish) { const v = { ...(dval('r2', 'c1', {}) || {}) }; if (t.value) v[d.fish] = t.value; else delete v[d.fish]; G.draft['r2.c1'] = v; return render(); }
  if (d.iv) { const v = dval('r4', 'plan', { ids: [] }) || { ids: [] }; const ids = t.checked ? [...new Set([...(v.ids || []), d.iv])] : (v.ids || []).filter(x => x !== d.iv); G.draft['r4.plan'] = { ids }; return render(); }
  if (d.view) { const n = +t.value; if (!isFinite(n) || n < 12 || n > 36) { toast('Enter an age between 12 and 36 h.', true); return render(); } G.view[d.view] = n; return render(); }
  if (d.state) { await setState({ [d.state]: t.type === 'checkbox' ? t.checked : t.value }, `Set ${d.state} = ${t.type === 'checkbox' ? t.checked : t.value}`); scheduleScore(); return; }
  if (d.release) { await setState({ [`released/${d.release}`]: t.checked }, `${t.checked ? 'Released' : 'Withdrew'} evidence ${d.release.toUpperCase()}`); return; }
  if (d.insp) { G.host.insp[d.insp] = t.value; if (d.insp === 'r') G.host.insp.q = Q.inRound(t.value)[0].id; return render(); }
  if (t.id === 'autoClose') { G.host.autoClose = t.checked; return; }
  if (t.name === 'j_icon') { G.view.icon = t.value; return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draftt) G.draft[t.dataset.draftt + '.t'] = t.value;
  if (t.dataset.rf) G.draft['rf.' + t.dataset.rf] = t.value;
  if (t.id && t.matches('input[type=text],input[type=number],input[type=password],textarea') && !t.dataset.draftt && !t.dataset.rf && !t.readOnly) G.dirty[t.id] = t.value;
  if (t.id === 'j_code') G.view.code = t.value.toUpperCase();
  if (t.id === 'j_name') G.view.name = t.value;
  if (t.id === 'j_members') G.view.members = t.value;
});
document.addEventListener('focusout', async e => {
  if (e.target.id === 'j_code' && G.role === 'home') { const c = e.target.value.trim().toUpperCase(); if (/^[A-Z0-9]{6}$/.test(c) && c !== G.sid) { G.view.code = c; await peek(c); render(); } }
});
window.addEventListener('hashchange', () => location.reload());
window.CASE014 = { G, get DB() { return DB; }, SCORE, CASE, Q };
boot();
</script>
